[workspace]
resolver = "2"
members = [
    "crates/deviceout-core",
    "crates/deviceout-sink",
    "crates/deviceout-engine",
    "crates/deviceout-plugin",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["DeviceOut"]
repository = "https://github.com/MindsMaster/DeviceOut"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
